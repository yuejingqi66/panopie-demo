        const replyBy = (iso, days) => {
          const time = Date.parse(iso || ''); if (!Number.isFinite(time)) return '';

        const defaults = () => ({

        const load = () => { try { return { ...defaults(), ...JSON.parse(localStorage.getItem(key) || '{}') }; } catch { return defaults(); } };

        const itemStoreId = item => item.merchantStoreId || storeKey(item.store);

        let migratedListings = false;

        if (migratedListings) persist();
        const esc = (value = '') => String(value).replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));

        const params = () => new URLSearchParams(location.search);
        const view = () => params().get('view') || 'home';
        const allProducts = () => { const remote = remoteCatalog.concat(remoteCartProducts.filter(item=>!remoteCatalog.some(row=>row.id===item.id))); const rows = useBackend() ? remote.concat((state.merchantProducts || []).filter(item => !remote.some(row => row.id === item.id))) : backendConfigured() ? [] : catalog.concat(state.merchantProducts || []); return state.focusProduct && !rows.some(item => item.id === state.focusProduct.id) ? rows.concat(state.focusProduct) : rows; };
        const marketplaceProducts = () => useBackend() ? remoteCatalog : backendConfigured() ? [] : catalog.concat((state.merchantProducts || []).filter(item => item.visibility === 'Active' && item.reviewStatus === 'Approved'));
        const product = id => allProducts().find(item => item.id === id);
        const cartEntries = () => Object.entries(state.cart || {}).map(([key, entry]) => {

        const cartCount = () => cartEntries().reduce((total, entry) => total + entry.quantity, 0);

        let hydrateRun = 0;

        const addresses = () => {

          const fields = window.PANOPIE_LOCATIONS?.addressFields?.[formCountry] || { city: 'City', region: 'State / province / region', postal: 'Postcode' };

          const unusable = address => problem(address) === 'outside' ? 'Stores can’t deliver to this country.' : problem(address) === 'quebec' ? 'Orders can’t be sent to Quebec during the pilot.' : problem(address) === 'northern-ireland' ? 'Orders can’t be sent to Northern Ireland during the pilot.' : '';
          const savedList = records.length ? `<section class="workspace-section"><h2>Saved addresses</h2><div class="workspace-lines">${records.map(address => `<div class="workspace-line"><div class="workspace-line-main"><strong>${esc(address.recipient_name)} ${address.is_default ? '· Default' : ''}</strong><span>${esc([address.line1, address.line2, window.PANOPIE_LOCATIONS?.addressPlace?.(address) || `${address.city}, ${address.region} ${address.postal_code}`, window.PANOPIE_LOCATIONS?.addressCountry?.(address.country_code) || address.country_code].filter(Boolean).join(' · '))}</span>${unusable(address) ? `<span class="address-unusable">${esc(unusable(address))}</span>` : ''}</div><div class="address-actions">${address.is_default || unusable(address) ? '' : `<button class="table-action" type="button" data-address-default="${esc(address.id)}">Make default</button>`}<a class="table-action" href="${path('addresses', { id: address.id })}" data-route="addresses" data-id="${esc(address.id)}">Edit</a><button class="table-action" type="button" data-address-delete="${esc(address.id)}">Remove</button></div></div>`).join('')}</div></section>` : '';
          return buyerLayout('addresses', `<div class="workspace-header"><div><h1>Delivery addresses.</h1><p class="workspace-lead">Save more than one address and pick a default for checkout. Your default address also sets Ship to.</p></div></div>${savedList}<section class="workspace-section"><h2>${editing ? 'Edit address' : 'Add an address'}</h2><form class="form-layout" data-form="address"><input type="hidden" name="id" value="${esc(editing?.id || '')}" /><fieldset><div class="form-field"><label for="address-recipient">Recipient name</label><input id="address-recipient" name="recipient" autocomplete="name" value="${esc(value('recipient_name', state.buyer.name))}" required /></div>${(() => { const chosen = formCountry; return `<div class="form-field"><label for="address-country">Country</label><select id="address-country" name="country" autocomplete="country" aria-describedby="address-country-help" required>${deliveryCountries.map(([code, name]) => `<option value="${code}" ${chosen === code ? 'selected' : ''}>${name}</option>`).join('')}${editing && !delivers(chosen) ? `<option value="${esc(chosen)}" selected>${esc(chosen)} (orders can’t be sent here)</option>` : ''}</select><p class="form-help" id="address-country-help">${esc(window.PANOPIE_LOCATIONS?.deliveryLine || '')}</p></div>`; })()}<div class="form-field is-wide"><label for="address-line">Street address</label><input id="address-line" name="address" autocomplete="address-line1" value="${esc(value('line1'))}" required /></div><div class="form-field is-wide"><label for="address-line-two">Apartment, suite, etc. (optional)</label><input id="address-line-two" name="line2" autocomplete="address-line2" value="${esc(value('line2'))}" /></div><div class="form-field"><label for="address-city">${esc(fields.city)}</label><input id="address-city" name="city" autocomplete="address-level2" value="${esc(value('city'))}" required /></div><div class="form-field"><label for="address-region">${esc(fields.region)}</label><select id="address-region" name="region" autocomplete="address-level1" aria-describedby="address-quebec-note" required>${addressRegionOptions(formCountry, value('region'))}</select><p class="form-help address-quebec-note" id="address-quebec-note" role="status">${esc(window.PANOPIE_LOCATIONS?.deliveryNote?.[window.PANOPIE_LOCATIONS?.deliveryProblem?.(formCountry, value('region'), value('postal_code'))] || '')}</p></div><div class="form-field"><label for="address-postal">${esc(fields.postal)}</label><input id="address-postal" name="postal" autocomplete="postal-code" aria-describedby="address-postal-error" value="${esc(value('postal_code'))}" required /><p class="form-help" id="address-postal-error"></p></div><div class="form-field"><label class="form-choice"><input name="isDefault" type="checkbox" ${editing?.is_default || (!editing && !records.length) ? 'checked' : ''} /> Use as my default address</label></div></fieldset><div class="form-actions"><button class="platform-button" type="submit">${editing ? 'Save changes' : 'Save address'}</button>${editing ? `<a class="platform-button is-secondary" href="${path('addresses')}" data-route="addresses">Cancel</a>` : ''}</div><p class="form-result" aria-live="polite"></p></form></section>`);
        };
        const settings = () => {

          return buyerLayout('settings', `<div class="workspace-header"><div><h1>Settings.</h1><p class="workspace-lead">Update your personal details and choose the messages you want Panopie to send.</p></div></div><form class="form-layout" data-form="settings"><fieldset><div class="form-field"><label for="settings-name">Full name</label><input id="settings-name" name="name" value="${esc(state.buyer.name)}" required /></div><div class="form-field"><label for="settings-email">Email</label>${emailField}</div><div class="form-field"><label for="settings-phone">Phone</label><input id="settings-phone" name="phone" type="tel" value="${esc(state.buyer.phone)}" /></div><div class="form-field"><span>Notifications</span><label class="form-choice"><input name="orderUpdates" type="checkbox" ${prefs.orderUpdates ? 'checked' : ''} /> Order and shipping updates (shown in Panopie; email isn’t switched on yet)</label><label class="form-choice"><input name="productUpdates" type="checkbox" ${prefs.productUpdates ? 'checked' : ''} /> New product updates</label></div></fieldset><div class="form-actions"><button class="platform-button" type="submit">Save settings</button></div><p class="form-result" aria-live="polite"></p></form><p class="notice">Your password, two-step sign-in and privacy requests are in ${route('security', 'Security &amp; privacy')}.</p>`);
        };
        const returns = () => {
          if (!state.buyer.signedIn) return publicReturns();
          const selected = state.orders.find(order => order.id === params().get('id'));
          return buyerLayout('returns', `<div class="workspace-header"><div><h1>Returns &amp; support.</h1><p class="workspace-lead">Every return starts with the order and the store policy. Panopie keeps the request and messages together, while the merchant remains responsible for the final fulfillment decision.</p></div>${selected ? `<a class="platform-button is-secondary" href="${path('tracking', { id: selected.id })}" data-route="tracking" data-id="${esc(selected.id)}">View order</a>` : ''}</div><section class="workspace-section"><h2>Start with an order</h2>${state.orders.length ? `<div class="workspace-lines">${state.orders.map(order => `<div class="workspace-line"><div class="workspace-line-main"><strong>${esc(order.id)} · ${esc(order.store)}</strong><span>${esc(order.itemName)} · ${esc(order.status)}</span></div><a href="${path('returns', { id: order.id })}" data-route="returns" data-id="${esc(order.id)}">${selected?.id === order.id ? 'Selected' : 'Choose order'}</a></div>`).join('')}</div>` : `<div class="workspace-lines"><div class="workspace-line"><div class="workspace-line-main"><strong>No order available for a return</strong><span>Orders will appear here after checkout. Until payments are connected, test orders do not create a merchant return request.</span></div><a href="${path('shop')}" data-route="shop">Browse marketplace</a></div></div>`}</section><section class="workspace-section"><h2>${selected ? 'Return request' : 'What happens next'}</h2>${selected ? `<div class="workspace-lines"><div class="workspace-line"><div class="workspace-line-main"><strong>Eligibility check</strong><span>Before a live request can be sent, Panopie must show the merchant return window, condition requirements, return address, label rules, and refund method for this order.</span></div>${status('Not connected', 'is-warning')}</div><div class="workspace-line"><div class="workspace-line-main"><strong>Need help now?</strong><span>Ask support about ${esc(selected.id)} without leaving your account.</span></div><a href="${path('messages')}" data-route="messages">Open messages</a></div></div>` : `<div class="support-steps"><div><strong>1. Choose the order</strong><span>Return eligibility is always tied to a specific store and product.</span></div><div><strong>2. Review the policy</strong><span>Dates, condition, fees, and refund timing must be visible before a request is submitted.</span></div><div><strong>3. Track the outcome</strong><span>Messages, label progress, receipt, and refund status should stay in the order timeline.</span></div></div>`}</section><p class="notice"><strong>Pilot boundary:</strong> this page maps the real return journey but cannot approve a return, issue a label, collect a parcel, or send a refund yet.</p>`);
        };
        const security = () => {
          if (!state.buyer.signedIn) return signInGate();
          return buyerLayout('security', `<div class="workspace-header"><div><h1>Security &amp; privacy.</h1><p class="workspace-lead">A public marketplace needs clear control over account access and customer data. This page defines those controls before the live authentication provider is enabled.</p></div></div><section class="workspace-section"><h2>Account access</h2><div class="workspace-lines"><div class="workspace-line"><div class="workspace-line-main"><strong>Email verification</strong><span>${useBackend() ? 'Supabase sends verification on account creation; the final branded email and redirect flow still need production testing.' : 'Email verification is not available in browser-only pilot mode.'}</span></div>${status(useBackend() ? 'Needs test' : 'Not connected', 'is-warning')}</div><div class="workspace-line"><div class="workspace-line-main"><strong>Password &amp; recovery</strong><span>Password resets and session management belong to the secure identity provider, never to a browser-stored profile.</span></div>${status('Provider flow required', 'is-warning')}</div><div class="workspace-line"><div class="workspace-line-main"><strong>Two-factor authentication</strong><span>Offer it for staff and merchants first, then make it available to shoppers who want additional protection.</span></div>${status('Planned', 'is-muted')}</div></div></section><section class="workspace-section"><h2>Your data</h2><div class="workspace-lines"><div class="workspace-line"><div class="workspace-line-main"><strong>Download or delete account data</strong><span>A production data request must include identity checks, export scope, retention rules, and a support record.</span></div><a href="${path('privacy')}" data-route="privacy">Read privacy</a></div><div class="workspace-line"><div class="workspace-line-main"><strong>Marketing preferences</strong><span>Order updates and new-product updates are managed in Settings.</span></div><a href="${path('settings')}" data-route="settings">Open settings</a></div></div></section>`);
        };
        const policyHeader = (title, copy, label, detail) => `<header class="terms-header"><div><h1>${title}</h1><p>${copy}</p></div><div class="terms-meta"><strong>${label}</strong><span>${detail}</span></div></header>`;
        const legalStatus = () => {
          const review = legalReviewReady();
          const payment = publicCommerceReady();
          // Written for shoppers and stores. The owner's release checklist lives in the project documents, not on this public page.
          return `<section class="terms-page">${policyHeader('Pilot status.', 'Panopie is a private pilot. You can look around, but you can’t pay for an order yet. This page says what works today and what has to happen before paid checkout opens.', payment ? 'Checkout being tested' : 'Private pilot', payment ? 'Every payment is still confirmed by our server before an order goes ahead.' : 'Paid checkout is not open. No order is charged.')}<div class="terms-layout"><aside class="terms-toc"><strong>On this page</strong><nav><a href="#now">What works now</a><a href="#before">Before checkout opens</a><a href="#operator">Who runs Panopie</a><a href="#contact">Contact</a></nav></aside><article class="terms-content"><section class="terms-section" id="now"><h2>What works now</h2><p>You can browse stores and pieces that Panopie has reviewed, save pieces, follow stores, add pieces to your bag, and send messages. You can’t pay for an order, and no card is charged. Stores can apply and prepare listings for review.</p></section><section class="terms-section" id="before"><h2>Before paid checkout opens</h2><p>Panopie will publish its legal name, address, and contact details on this page and in the terms. It will finish setting up payments with its payment provider, finish the buyer terms and privacy notice, and set the date they take effect. Before you order, every store that sells will show its store name, its seller type (company, registered sole proprietor, or individual seller), where it is based, how it ships, and its return policy. A company also shows its registered name. When paid checkout opens, you will also see each store’s phone number and business address at checkout, in your order copy, and in your order history, along with the legal name of an individual seller or registered sole proprietor. The store page does not show these.</p><p>Legal review: ${review ? `completed ${esc(legalProfile.legalReviewApprovedAt)}, version ${esc(legalProfile.legalReviewFrozenVersion)}.` : 'not done yet. The buyer terms and the privacy notice are drafts until an effective date is shown on them. The store pilot terms apply to a store from the day it applies, but a lawyer has not reviewed them yet, and they will change before paid checkout opens.'}</p></section><section class="terms-section" id="operator"><h2>Who runs Panopie</h2><p>Panopie was called THREADLINE until October 20, 2026.</p><p><strong>Legal name:</strong> ${legalValue(legalProfile.operatorLegalName)}<br /><strong>Business address:</strong> ${legalValue(legalProfile.operatorBusinessAddress)}</p></section><section class="terms-section" id="contact"><h2>Contact</h2><p><strong>Customer support:</strong> ${legalValue(legalProfile.customerSupportEmail)}<br /><strong>Privacy Officer:</strong> ${legalValue(legalProfile.privacyContactEmail)}</p><p>If you have an account, you can also send Panopie a message from the <a href="${path('messages')}" data-route="messages">Messages</a> page. The <a href="${path('help')}" data-route="help">Help</a> page answers common questions.</p></section><section class="terms-final"><h2>Read the drafts</h2><p>These pages describe how Panopie will work. They become final only when an effective date is shown on them.</p><a class="platform-button" href="${path('buyer-terms')}" data-route="buyer-terms">Read buyer terms</a> <a class="platform-button is-secondary" href="${path('privacy')}" data-route="privacy">Read privacy notice</a></section></article></div></section>`;
        };
        const publicReturns = () => `<section class="terms-page">${policyHeader('Returns & order help.', 'How returns, cancellations, and refunds will work when you can buy on Panopie. You don’t need an account to read this page.', 'Private pilot', 'You can’t buy or return anything yet.')}<div class="terms-layout"><aside class="terms-toc"><strong>Before you buy</strong><nav><a href="#store-policy">Store policy</a><a href="#cancellation">Cancellation</a><a href="#pre-owned">Pre-owned &amp; vintage</a><a href="#refund">Refund timing</a><a href="#contact">Getting help</a></nav></aside><article class="terms-content"><section class="terms-section" id="store-policy"><h2>Each store’s return policy</h2><p>Before you order, you will see which store sells the piece and its return policy: how long you have, what condition the piece must be in, what can’t be returned, where to send it, who pays return shipping, and how to start a return. A store’s policy can’t take away a right the law gives you. If a store ships from another country, it must give you a return address in your country, a prepaid return label, or a refund without a return.</p></section><section class="terms-section" id="cancellation"><h2>Cancellation</h2><p>Before you can pay, these terms will say how long you have to cancel, what happens if a store can’t ship a piece, and how you get confirmation. A store can’t replace this with an unclear “final sale” label.</p></section><section class="terms-section" id="pre-owned"><h2>Pre-owned and vintage pieces</h2><p>Every pre-owned or vintage listing shows what the store says about its condition, and for vintage, its era. Your order keeps a copy of that statement. If a piece is materially different from what the store stated, you can return it for a refund even when the store’s policy says final sale. Tell the store within 14 days after delivery and add photos. The buyer terms explain the full rule. Panopie does not inspect or authenticate pieces.</p></section><section class="terms-section" id="refund"><h2>Refunds and exchanges</h2><p>Each store will say how it checks a returned piece, how and when it refunds you, how return labels work, and who to contact about a problem. You will see these details again in your order.</p></section><section class="terms-section" id="contact"><h2>Getting help</h2><p>Customer support email: ${legalProfile.customerSupportEmail ? esc(legalProfile.customerSupportEmail) : 'not published yet'}. If you have an account, you can also message Panopie from the Messages page after you sign in. A store must answer a return request, or a message about a late, lost, damaged, or wrong item, within 2 business days (Monday to Friday, not counting Ontario public holidays). If it doesn’t, you can ask Panopie support to step in. Refunds come from the store’s payment account, not from Panopie.</p></section></article></div></section>`;
        const help = () => `<section class="support-page"><div class="support-heading"><h1>How can we help?</h1><p>Start with the order, store, or product. Support is set up simply for now. It will be connected fully before real stores go live.</p></div><section class="support-steps"><div><strong>Shopping &amp; account</strong><span>Saved pieces, addresses, access, and marketplace browsing.</span><a href="${path('account')}" data-route="account">Open account</a></div><div><strong>Orders &amp; delivery</strong><span>Order status, merchant fulfillment, tracking, and delivery questions.</span><a href="${path('returns')}" data-route="returns">Read order help</a></div><div><strong>Before public payment</strong><span>Read the buyer, privacy, and return information before the public checkout opens.</span><a href="${path('legal-status')}" data-route="legal-status">See pilot status</a></div></section><section class="workspace-section support-links"><h2>Before paid orders</h2><div class="workspace-lines"><div class="workspace-line"><div class="workspace-line-main"><strong>Customer support channel</strong><span>${legalProfile.customerSupportEmail ? `Public support contact: ${legalValue(legalProfile.customerSupportEmail)}.` : 'Support email, service hours, response targets, and escalation ownership need to be published before shoppers can place paid orders.'}</span></div>${status(legalProfile.customerSupportEmail ? 'Configured' : 'Required', legalProfile.customerSupportEmail ? '' : 'is-warning')}</div><div class="workspace-line"><div class="workspace-line-main"><strong>Store support responsibility</strong><span>Each merchant needs a service contact, return policy, and order-resolution path that is visible on its storefront.</span></div><a href="${path('seller-start')}" data-route="seller-start">Merchant onboarding</a></div></div></section>`;
        const buyerTerms = () => `<section class="terms-page">${policyHeader('Buyer terms.', 'This is a draft. You can’t pay for anything on Panopie yet. Some sections below describe what checkout must show before it opens. Draft updated November 16, 2026. Added how UK VAT and import charges work for delivery to the United Kingdom.', 'Pre-launch draft', 'Not a final agreement until an effective date is shown.')}<div class="terms-actions"><a class="platform-button is-secondary" href="${path('legal-status')}" data-route="legal-status">See pilot status</a><button class="platform-button is-secondary" type="button" data-print-terms>Print or save draft</button></div><div class="terms-layout"><aside class="terms-toc"><strong>In this draft</strong><nav><a href="#where">Where the pilot is offered</a><a href="#marketplace">Marketplace role</a><a href="#before-order">Before you order</a><a href="#delivery-returns">Delivery &amp; returns</a><a href="#store-ends">If a store is suspended</a><a href="#service">Support &amp; changes</a></nav></aside><div class="terms-content"><section class="terms-checklist"><h2>You can’t pay yet</h2><p>Panopie is a private pilot and does not take payments yet. Some sections below describe what checkout must show before it opens. These terms will change before then.</p></section><section class="terms-section" id="where"><h2>Where the pilot is offered</h2><p>Stores on Panopie can deliver to the United States, Canada (except Quebec), the United Kingdom (except Northern Ireland), Australia and New Zealand. Each store chooses which of these countries it ships to. Stores must not ship orders to an address in Northern Ireland during the pilot.</p><p>During the pilot, Panopie is not offered to shoppers in Quebec, and stores must not ship orders to an address in Quebec. Please do not place an order for delivery in Quebec. If an order is placed for delivery in Quebec, the store will not ship it and the order will be canceled. Once paid checkout is open, any amount you paid for that order will be refunded in full. Stores based in Quebec or shipping from Quebec cannot join the pilot.</p></section><section class="terms-section" id="marketplace"><h2>Marketplace role</h2><p>Panopie is an online marketplace where independent stores sell clothing. It was called THREADLINE until October 20, 2026. Its legal operator has not been named yet. We will show the operator’s legal name, address, and support contact on this page and on the Pilot status page before any paid order.</p><p>Panopie is a marketplace. Each store is a separate seller. When you buy a piece, your contract of sale is with that store, not with Panopie. Panopie is not the seller, except where the law treats it as one for a specific purpose, such as collecting tax. Panopie runs the website, reviews stores and listings before they go live, and keeps a record of your order. The store is responsible for the piece, its listing, stock, shipping, returns, and refunds. A store can be a company, a registered sole proprietor, or an individual seller, and the store page shows which. What a listing says about condition, age, era, authenticity, and what a piece was made from is the store’s own statement. Panopie checks that a listing is complete and has no obvious problem. It does not inspect, grade, date, or authenticate pieces, and approving a listing does not confirm that the listing is true. Your order keeps a copy of what the listing said when you ordered, including the condition, condition notes, tags answer, vintage type, era, and any year or history note. For a reworked piece, it also keeps the original brand and item, and the sentence about them shown on the listing. Panopie’s legal name and address will be shown here before any paid order. “Verified purchase” means the review was written from the account that bought the piece on Panopie, after the order was marked delivered or complete.</p></section><section class="terms-section" id="before-order"><h2>Before you confirm an order</h2><p>Once paid checkout opens, checkout must show: the store that sells each piece (its store name, seller type, legal name, phone number, and business address); item name, selected options, quantity and price; currency, taxes, shipping cost or calculation method; delivery estimate and destination limits; payment method; cancellation rules; return/refund terms; and the total amount before the customer submits the order. The customer must be able to correct errors and keep a copy of the order, which also stays in their order history.</p><p>Each store sets its prices in one currency, and every price shows which one. On a site that uses a different currency from the store, you may also see an amount marked “about” in that site’s currency. It is only an estimate, worked out from a public exchange rate. The product page, bag, and checkout show the rate’s date and source. It is not the price. If your card is in a different currency from the store’s price, your bank or card company converts it at its own rate and may add a fee. Each store chooses the countries it ships to, and you can order only from a store that ships to the country of your delivery address. A piece that ships from another country may have import duties, taxes, customs fees, or carrier brokerage fees when it arrives. Unless the store prepays them, they are not included in the listing price. If you have to pay any of these charges when the piece arrives, and checkout did not show you the amount or an estimate before you paid, the store must refund them. If checkout showed an estimate and you had to pay more, the store must refund the difference. If the store said these charges were prepaid and you still had to pay any of them, the store must refund what you paid. Keep the receipt from the carrier or customs, or another record of the payment, and send it to the store from your order. Before paid checkout opens, these terms will also say how checkout shows these charges.</p><p>For delivery to the United Kingdom: on the UK site, amounts in pounds for stores based outside the UK are estimates. You pay the store’s price, in the store’s currency. For a store based outside the UK, when its pieces in your order come to £135 or less (delivery doesn’t count toward the £135), Panopie adds UK VAT (20%) at checkout, on the pieces and on delivery, before you pay, and gives you a VAT invoice. Panopie decides whether a store’s pieces come to £135 or less using the exchange rate it records for that day, which may differ a little from the estimates you saw before, and checkout shows the result before you pay. When they come to more than £135, no UK VAT is added at checkout. Unless the store prepays them, you pay import VAT (20% of the price, delivery, and any duty), any duty, and the carrier’s fee when the parcel arrives, and the rules above apply. Checkout shows what you pay now and, as an estimate, what you may pay on arrival. Panopie does not collect duty: the carrier or customs collects it from you when the parcel arrives. If a carrier asks you to pay UK VAT that Panopie has already charged at checkout, ask the carrier to correct it, and tell us from your order so we can check our records. A store based in the UK sets its prices in pounds.</p><p>Each store page shows where the store is based: the country and, for Canada or the United States, the province, territory, or state when it is shown. An individual seller shows only the country, unless the store owner chooses to show the region. This is the store’s own statement, and Panopie does not verify it. The store page also shows where pieces ship from, the processing time, and the return policy.</p></section><section class="terms-section" id="delivery-returns"><h2>Delivery, cancellation &amp; returns</h2><p>Each store must state when and where it ships, the carrier or service method when known, tracking expectations, its cancellation window, return eligibility, exclusions, condition requirements, return address, fees, and refund timing. No unclear “final sale” label can replace these disclosures.</p><h3>Order status</h3><p>When the store marks your order delivered, it enters the delivery date the carrier shows. If you don’t confirm you received it, or report a problem, within 5 business days after that date, your order is marked complete. This doesn’t mean you agreed that it arrived or was as described. Return windows start on the delivery date, or on the day you actually got the piece if that was later. If your piece didn’t arrive, tell the store from your order, even after it is marked complete. Sometimes a payment needs a check before your order goes to the store. If that happens, we tell you, and within 2 business days we either confirm your order or cancel it and refund you in full.</p><h3>Canceling</h3><p>You can cancel an order in your account until the store starts preparing it, and you get a full refund. After that, you can ask the store to cancel, and it must answer within 2 business days. If the store hasn’t shipped by the date shown on your order, ask the store to cancel from your order. It must cancel and refund you in full. If it doesn’t answer within 2 business days, choose “Ask Panopie to review” and we can cancel the order and refund you from the store’s payment account. If you dispute the payment with your bank or card issuer, we can’t cancel or refund the order while the dispute is open. Your bank or card issuer decides the dispute.</p><h3>Shipping</h3><p>Each store charges shipping once per order, at the price shown at checkout.</p><h3>Returns</h3><p>Every store must accept returns for at least 14 days after delivery. A store may mark a single one-of-a-kind pre-owned or vintage piece as not returnable for change of mind, and the listing says so before you order. This never applies to a piece that isn’t as described, and it doesn’t affect your rights under the law. Once the store gets the piece back, or you show it was sent, it must refund you within 14 days.</p><h3>If a store refuses</h3><p>You can ask Panopie to review the store’s answer from your order. We look at the order, shipping, and messages, and tell the store what it must do. The store is still the seller.</p><h3>If a piece is not as described</h3><p>Your order keeps a copy of what the listing said when you ordered, including the condition, condition notes, tags answer, vintage type, and era. If the piece you receive is materially different from that, or is not the size you ordered, tell the store within 14 days after it is delivered. Start a return request from the order in your account, choose the reason that fits, and add photos that show the problem. The store must then accept the return, refund the price and the original shipping charge, and pay for return shipping. This applies even if the store’s policy says “final sale”. This is Panopie’s minimum rule. The law where you live may give you more time or stronger rights, and these terms and store policies do not take those away.</p><h3>Canceling in the United Kingdom</h3><p>If you live in the United Kingdom and buy from a store that sells as a business, you can usually cancel your order for any reason until 14 days after you receive it, even for pre-owned and vintage pieces. The store’s return policy says how to send a piece back.</p><h3>Returning a piece to another country</h3><p>If a store ships your order from another country and you return a piece under its return policy, these terms, or the law, the store must give you one of these: a return address in your country, a prepaid return label, or a full refund without sending the piece back. The store chooses which one, and its return policy says which it offers. You do not have to pay import duties, taxes, or customs fees to send the piece back. If the piece was not as described, the store pays for the return. For other returns, the store’s policy says who pays. If you pay, the store may take the cost of its prepaid label from your refund, but it must tell you the cost first.</p><h3>If the store doesn’t answer</h3><p>A store must answer your return request, or your message about a late, lost, damaged, or wrong item, within 2 business days (Monday to Friday, not counting Ontario public holidays). If it hasn’t, open the conversation about your order and choose “Ask Panopie to review”, or message Panopie support from the Messages page. We will contact the store and tell you what happens next. Refunds come from the store’s payment account, not from Panopie. This does not affect any right the law gives you.</p><h3>If a store pauses orders</h3><p>A store can pause orders for up to 30 days at a time. While orders are paused, you can still see the store’s pieces, but you can’t add them to your bag or order them. The store page shows the date the store opens for orders again. This doesn’t change orders you’ve already placed. The store must still deal with them as these terms say, and must answer your return request or your message about a delivery problem within 2 business days. If it doesn’t, you can ask Panopie to review, as described above. If you message a store that has paused orders, you get an automatic reply from Panopie with the date it opens again.</p></section><section class="terms-section" id="store-ends"><h2>If a store is suspended or leaves</h2><p>Panopie may suspend a store, and a store may leave Panopie. The store and its listings are then hidden from shoppers. Orders already placed are not canceled because of this. The store must still ship your order, or cancel it and give you a full refund. If the store does not reply or does not act, contact Panopie support with your order details. We will contact the store and help you get the order shipped or refunded. Before paid checkout opens, these terms will also explain what Panopie can do through the payment service when a store does not act.</p></section><section class="terms-section" id="service"><h2>Support, changes &amp; notices</h2><p>Customer support email: ${legalProfile.customerSupportEmail ? esc(legalProfile.customerSupportEmail) : 'not published yet'}. The final terms must show service hours, a complaints route, the date these terms take effect, and how shoppers will be told about material changes before they apply.</p></section></div></div></section>`;
        const privacy = () => `<section class="terms-page">${policyHeader('Privacy, clearly.', 'This draft explains, in plain words, what personal information Panopie plans to collect and how we use it. It isn’t final until our payment and email providers are set up and an effective date is shown. Updated October 23, 2026: we added what we include about your reports when you ask for a copy of your data.', 'Pre-launch draft', 'No public payments are collected in this pilot.')}<div class="terms-actions"><a class="platform-button is-secondary" href="${path('legal-status')}" data-route="legal-status">See pilot status</a><button class="platform-button is-secondary" type="button" data-print-terms>Print or save draft</button></div><div class="terms-layout"><aside class="terms-toc"><strong>What this covers</strong><nav><a href="#data">Data collected</a><a href="#uses">How it is used</a><a href="#sharing">What shoppers can see</a><a href="#where">Where data is stored</a><a href="#choices">Your choices</a><a href="#device">On your device</a><a href="#contact">Privacy Officer</a></nav></aside><div class="terms-content"><section class="terms-checklist"><h2>Private pilot boundary</h2><p>Account, address, bag, saved-piece, follow, store-application, and order-request data can be used in this private pilot. This version of the website does not collect card or bank credentials.</p></section><section class="terms-section" id="data"><h2>Data collected</h2><p>Depending on what you use, Panopie may process account details, delivery address, saved pieces, the stores and brands you follow, bag and order records, store-application information, support messages, reports you send about listings, and limited technical information needed to secure and operate the service. Payment credentials must be processed by the approved payment provider, not stored in Panopie’s browser interface. For people who apply to sell, this includes the seller type, legal name, an optional Canadian GST/HST number, review notes, and the record of accepting the merchant terms. People who apply to sell also give the kind of store they run, their store’s social media accounts and follower counts, their online store address if they have one, and, where the application asks for it, about how many pieces the store sells online each month. These are the store’s own figures. We use them only to review a store’s application and to keep a record of the decision. We may compare them with the store’s public pages, but we never ask for account passwords. Shoppers can’t see these figures. Only the store’s owner, its administrators, and Panopie review staff can see them. Panopie does not collect identity documents or dates of birth in this pilot; the payment provider will check seller identity before paid checkout opens. If the law later requires Panopie to collect more, this notice will be updated first. For people who sell, this also includes reports that shoppers send about their listings, and the decisions we make about them.</p></section><section class="terms-section" id="uses"><h2>How it is used</h2><p>Panopie uses personal information to run accounts, review store applications and listings, arrange fulfillment, show the site, delivery options and tax notes for your delivery country, answer support requests, prevent fraud, keep records, and meet legal duties. Marketing messages are optional and separate from order notices.</p><p><strong>Stores and brands you follow.</strong> When you follow a store or a brand, we keep which one you follow and when. We use this only to show you what you follow and to list their pieces first in your results. You can turn that off with the “Show stores and brands I follow first” switch next to the search box. We don’t tell stores or brands who follows them. This record is kept until you unfollow or your account is deleted. We don’t save your search words to your account.</p><p id="reports"><strong>Reports about listings.</strong> If you report a listing, we keep the listing, the reason you chose, what you wrote, the time, and your account. We use this to check the listing, to keep Panopie safe, and to spot reports that are false or sent in bulk. To do that, staff can see whether your account belongs to a store, roughly how long you have had it, how many reports you have sent, and how many of them needed no action. When staff finish looking at a report, they add a short note. If you ask for the information we hold about you, we include your reports, our notes about them, and how many of your reports needed no action. We leave out any part of a note that is about someone else.</p><p>Only Panopie staff can read reports, and staff can’t read reports about a store they belong to. We don’t give the store, or anyone else, your name or account, unless the law requires us to, for example under a court order. If a store is run by a person who asks us for the information we hold about them, the law may require us to share what a report says about them, but not who sent it. We may tell a store what kind of report led to a decision about its listing.</p><p>We delete a report 24 months after we finish looking at it. This happens the next time someone sends a report or staff work on reports, so a report may stay a little longer. If a report led us to remove a listing or suspend a store, we keep it as long as we keep the record of that decision. If your account is deleted, we remove your account from your reports, but what you wrote stays, so please don’t put personal details in a report. You can ask for a copy of your reports, or ask us to delete one, as described under Your choices and requests. We may keep a report that we acted on.</p></section><section class="terms-section" id="sharing"><h2>What shoppers can see</h2><p>Shoppers can see each store’s name, its location as the store states it (the country, and the province, territory, or state when shown), its support email, where it ships from, its processing time, its return policy, and the month Panopie first approved the store (shown as “On Panopie since”). A company’s registered name is also shown. When paid checkout opens, a buyer will also see, at checkout, in their order copy, and in their order history, the phone number and business address of each store they order from, and the legal name of an individual seller or registered sole proprietor. If the seller works from home, this is their home address. The store page itself does not show these. For an individual seller or a registered sole proprietor, the store page shows “Individual seller” or “Registered sole proprietor”, not the person’s legal name. An individual seller’s province, territory, or state is shown only if the owner chooses. A store’s GST/HST number is never shown to shoppers; Panopie review staff and the store’s own team can see it. Follower counts and sales figures given in a store application are never shown to shoppers either. If a store pauses orders, shoppers see that orders are paused and the date the store opens for orders again. When someone on a store’s team replies to you in Messages, you see the store’s name, not that person’s name. Panopie may give a seller’s legal name and contact details to a buyer, a payment provider, a court, a regulator, or a tax authority when the law requires it, or when it is needed to deal with a legal claim about an order. If you write a review, it is shown with the name on your profile, or “Shopper” if you have not set one. For an order, the store receives only what it needs to ship and support that order.</p></section><section class="terms-section" id="where"><h2>Where your information is stored</h2><p>Panopie’s database, sign-in system, and uploaded photos are hosted by Supabase on Amazon Web Services servers in Ohio, United States (region us-east-2). Netlify delivers the website files from servers in many countries and may keep basic technical logs, such as IP addresses. Sign-in and account emails are sent through Supabase today; if we change email providers, we will update this page. Our pages load fonts from Google Fonts, so your browser connects to Google’s servers, which receive your IP address and basic browser details. This means your information is stored and processed outside Canada, mainly in the United States. While it is there, it is subject to US law, and US courts, law enforcement, and national security authorities may be able to access it. Panopie remains responsible for your information when a service provider handles it for us.</p><p><strong>Exchange rates.</strong> To show approximate prices in the currency of the site you are on, your browser gets the latest published exchange rate once a day, the first time you open Panopie that day. It asks Frankfurter (frankfurter.dev), a free public service, for rates from the US dollar to the Canadian dollar, British pound, Australian dollar and New Zealand dollar, calculated from the European Central Bank’s reference rates. If Frankfurter does not answer or has no recent rate, your browser asks the Bank of Canada instead. Like any website, these services and their network providers receive your IP address, basic browser details, the time of the request, and the fact that it comes from Panopie’s site. They do not receive the page you are on. We do not send them your name, account, bag, orders, or anything else about you. We do not control what they keep, and their own policies apply. A rate more than 5 days old is not used. If there is no recent rate, you see only the store’s own price. When you search or sort by price, your browser sends our servers the site you are on and the rate it has, so the results match. These rates are used only to show estimates.</p></section><section class="terms-section" id="choices"><h2>Your choices and requests</h2><p>You can ask for a copy of the personal information Panopie holds about you, or ask us to correct it. When you are signed in, you can request a copy of your account data or an account deletion review on the Security &amp; privacy page. For a correction or any other request, send Panopie support a message from the Messages page${legalProfile.privacyContactEmail ? `, or email the Privacy Officer (${esc(legalProfile.privacyContactEmail)})` : ''}.${legalProfile.privacyContactEmail ? '' : ' The Privacy Officer’s email will be added here when it is published.'} We will answer within 30 days after we receive your request. If we need more time and the law allows it, we will tell you why, give you the new date, and tell you that you can complain to the Office of the Privacy Commissioner of Canada. We may ask you to confirm the request from the email on your account. We will not ask for ID documents. If we must keep some records, such as orders, reports we acted on, review decisions, or staff actions, we will explain which ones and why. These records can include a seller’s legal name at the time, and may be kept after an account is closed. The final notice will state how long.</p></section><section class="terms-section" id="device"><h2>What is kept on your device</h2><p>Panopie does not load advertising or analytics scripts. Your browser keeps a few items in this site’s storage: your sign-in session, so you stay signed in; the size, color, and image you last picked; the store you last worked in; whether you closed the welcome card; whether you last chose to see products or brands on the Styles pages; which saved address you chose at checkout (a reference, not the address itself); your step in a store application; a short code that marks a review note as read (not the note itself); the site you chose (United States, Canada, United Kingdom, Australia or New Zealand); when you are signed in, a short note that the site was set from your default delivery address (your account ID, an internal ID for that address, and its two-letter country code, not the address itself), so we don’t switch the site again each time a page loads; and the latest exchange rate with its date and source, so your browser fetches it at most once a day. We choose the site from your browser’s language and region settings. When you sign in, or change your default delivery address, we switch the site to that address’s country if orders can be sent there. Choosing an address in another of these countries at checkout does the same, and checkout tells you when it happens. You can still change Ship to yourself at any time. We do not use your IP address to find where you are. If you press save or follow before you sign in, this browser tab also keeps that piece, store, or brand and the page you were on, so we can finish it after you sign in. It is removed when you sign in, leave the sign-in page, or close the tab, and we don’t use it after 15 minutes. Your bag, orders, and messages are kept on our servers, not on your device. Signing out removes your session and the note about your default address. The site you chose stays, even after you sign out, until you change it. You can remove it, and the other things this browser keeps, at any time by clearing this site’s data in your browser. This doesn’t delete your bag, orders, or messages, which are kept on our servers. On a shared device, always sign out.</p></section><section class="terms-section" id="contact"><h2>Privacy Officer</h2><p>Panopie was called THREADLINE until October 20, 2026. If you gave us information under that name, Panopie holds it now. Only the name changed. It is the same marketplace, and we use your information only for the purposes on this page.</p><p>Panopie’s Privacy Officer is responsible for how we handle personal information. Email: ${legalProfile.privacyContactEmail ? esc(legalProfile.privacyContactEmail) : 'not published yet'}. Mail: ${legalProfile.operatorBusinessAddress ? esc(legalProfile.operatorBusinessAddress) : 'not published yet'}. Legal operator: ${legalProfile.operatorLegalName ? esc(legalProfile.operatorLegalName) : 'not named yet'}.${legalProfile.privacyContactEmail ? '' : ' Until they are published, send privacy requests from the Messages page.'} If you are not satisfied with our answer, you can complain to the Office of the Privacy Commissioner of Canada. Effective date: ${legalProfile.effectiveDate ? esc(legalProfile.effectiveDate) : 'not set — this draft is not final'}.</p></section></div></div></section>`;
        const settlementAddendum = () => `<section class="terms-page">${policyHeader('Payment addendum.', 'For stores. This is a draft of how payments and payouts will work. It doesn’t promise any payout speed, and it isn’t final until Panopie publishes a version with an effective date.', 'PAN-SETTLEMENT-DRAFT-1.3', 'Draft. Not in effect, and you can’t accept it yet.')}<div class="terms-actions"><a class="platform-button is-secondary" href="${path('merchant-terms')}" data-route="merchant-terms">Read the Founding Store Pilot Terms</a><button class="platform-button is-secondary" type="button" data-print-terms>Print or save draft</button></div><div class="terms-layout"><aside class="terms-toc"><strong>In this draft</strong><nav><a href="#conditions">Conditions to activate</a><a href="#payment-model">Payment model</a><a href="#payouts">Payouts &amp; holds</a><a href="#refunds">Refunds &amp; disputes</a><a href="#records">Records &amp; changes</a></nav></aside><article class="terms-content"><section class="terms-checklist"><h2>Not ready to accept yet</h2><p>You can read this draft now, but you can't accept it yet. Panopie will publish a final version with a version number and an effective date before paid checkout opens. Before then, Panopie will name the company that runs Panopie.</p></section><section class="terms-section" id="conditions"><h2>1. Conditions to activate</h2><p>Before a store can take paid orders, Panopie must publish the name of the company that runs Panopie, its business address, and a support contact. Panopie must also confirm that the payment provider has verified the merchant's legal identity, payout account, and tax information. Panopie itself checks that the person accepting this addendum may act for the merchant, and checks the store's ships-from place, return policy, and right to sell its products. The merchant must finish Stripe's onboarding, accept the Stripe terms for its account, and give the phone number and business address that checkout shows to buyers. Paid checkout opens for a store only if Stripe can open an account for a business in the store's country and Panopie can take its selling fee there.</p></section><section class="terms-section" id="payment-model"><h2>2. Payment model and fees</h2><p>Panopie plans to use Stripe Connect direct charges. Each store has its own Stripe account. At checkout, each store is paid in a separate charge on its own account, so the buyer's card statement shows one charge for each store. The store is the seller of its pieces. The store pays Stripe's fees for its account directly to Stripe, at Stripe's prices for the country where its account is. These include card processing fees, any extra fee for a card from another country, currency conversion fees, and dispute fees. Panopie doesn't set, receive, or pay these fees. Panopie takes its selling fee, if there is one, from each charge. For stores that list in a currency other than Canadian dollars, it also takes a conversion charge that passes on Stripe's cost of converting that fee, with no profit added. Because the store pays Stripe's fees, Stripe, not Panopie, issues US Form 1099-K for the store's account where US law requires it.</p></section><section class="terms-section" id="payouts"><h2>3. Payouts, holds, and negative balances</h2><p>No payout speed is promised. Stripe pays out the store's balance on the schedule set for its account. Stripe's terms decide minimum payouts, failed payouts, holds, reserves, and how a negative balance is recovered. Panopie doesn't hold back any part of a store's payouts, doesn't ask Stripe for a reserve, and doesn't pause payouts. To protect buyers, Panopie may instead turn off paid checkout for the store, pause its listings, or suspend the store under section 10 of the Founding Store Pilot Terms.</p></section><section class="terms-section" id="refunds"><h2>4. Refunds, disputes, and service</h2><p>The final addendum must connect the merchant's return policy to the customer checkout flow, explain who approves and funds refunds, set the evidence and response process for disputes, and say what Panopie may do to protect buyers, such as turning off paid checkout for a store. When a store refunds all or part of the price of the pieces in an order, Panopie gives back the same share of its selling fee. Stripe doesn't give back its own fees on a refund, and Panopie doesn't pay them back. The final addendum will also set when Panopie may refund a buyer for a store that doesn't answer.</p></section><section class="terms-section" id="records"><h2>5. Records and changes</h2><p>Before it becomes effective, Panopie will publish the final version of this addendum with a version number and date, and each merchant must accept it before paid checkout opens for its store. Panopie will keep the version, the effective date, the parties, and the record of each acceptance. A later change that affects payments, payouts, liability, data, refunds, or checkout will be published as a new version.</p></section></article></div></section>`;

        };
        const sellerNav = active => `<aside class="workspace-nav"><div class="workspace-identity"><strong>${esc(state.merchant.storeName || 'Your store')}</strong><span>${state.merchant.submitted ? 'Pilot merchant workspace' : 'Application not submitted'}</span></div><nav class="workspace-nav-links" aria-label="Merchant navigation">${route('seller', 'Overview', active === 'seller')}${route('seller-products', 'Products', active === 'seller-products' || active === 'seller-product')}${route('seller-orders', 'Orders & fulfillment', active === 'seller-orders')}${route('seller-store', 'Store profile', active === 'seller-store')}${route('seller-payments', 'Payouts', active === 'seller-payments')}${route('merchant-terms', 'Pilot terms', active === 'merchant-terms')}</nav><div class="workspace-nav-utility"><a href="${path('shop')}" data-route="shop">View marketplace</a></div></aside>`;

        const merchantTerms = () => {
