          const sections = [
            ['pilot-status', '1. Pilot scope and when these terms take effect', `<p>These Founding Store Pilot Terms (the “Terms”) set the operating rules for anyone who applies to sell through Panopie. In these Terms, “the merchant” means the person or business that owns the store. A merchant can be an individual without a registered business, a registered sole proprietor, or a company or other registered entity. A “shopper” is a person who uses the marketplace, and a “buyer” is a shopper who has placed an order. This is a private early-stage marketplace pilot for independent sellers, boutiques, vintage stores, and emerging brands. It is not a promise of traffic, sales, financing, fulfillment, payment processing, insurance, or a public launch date.</p><p>${operatorLine}</p><p>Panopie was called THREADLINE until October 20, 2026. Only the name has changed. Where earlier versions of these Terms, Panopie’s records, or emails sent under the name THREADLINE use that name, they refer to Panopie.</p><p>This pilot is not offered in Quebec. Panopie does not approve a store whose store location is Quebec or that ships from Quebec. By applying, the merchant confirms that the store location and the ships-from place in its application are true, and it will tell Panopie if either changes. The merchant must not ship an order placed through Panopie to an address in Quebec during the pilot.</p><p>Submitting the application records the merchant’s acceptance of version ${FOUNDING_TERMS_VERSION}, together with the date, the time, and the account that accepted. Each later version that the merchant accepts is recorded in the same way. The Terms apply to the merchant from the time it submits the application. The right to publish listings starts when Panopie approves the store and the store status in the merchant workspace shows “Approved”. Approval does not turn on paid checkout. Until Panopie has published its legal operator, business address, and support contact, and the merchant has accepted a separate written addendum about payments and payouts (the “Payment Addendum”), checkout and payouts stay off and no order can be paid.</p>`],
            ['founding-offer', '2. Founding store offer and fees', `<p>For the first 90 calendar days after paid checkout opens for an approved founding store, Panopie will charge <strong>no security deposit, setup fee, annual fee, or platform commission</strong> on approved marketplace orders. The 90 days start on the day Panopie opens paid checkout for the store, and Panopie will tell the merchant that date in the merchant workspace when it does. Before that day no commission is charged, because no order can be paid. If Panopie extends the offer, it will say so in writing. This offer is non-transferable, applies only to the approved store, and can be withdrawn for a material breach, fraud, counterfeit goods, unsafe goods, or legal non-compliance.</p><p>The offer does not waive payment-processor charges, sales tax, GST/HST or other taxes, shipping, carrier surcharges, refunds, chargebacks, customs, product costs, insurance, or other third-party costs. Those amounts must be shown or agreed before checkout is activated. Any fee after the first 90 days will be set out in a new version of these Terms or in the Payment Addendum, with notice as section 14 describes, and applies only after the merchant accepts it.</p>`],
            ['merchant-admission', '3. Merchant identity, admission, and store control', `<p>The merchant must give a truthful store name, seller type, legal name, store location, responsible contact, support email for buyers, fulfillment location, and return policy, and a website or social profile if it has one. The store location is where the store is based: the country and, for Canada or the United States, the province, territory, or state. For an individual, or a sole proprietor who works from home, it is where that person lives. An individual or a sole proprietor gives their own full legal name. A company gives its registered name. An individual who applies confirms that they are an adult under the law of the place where they live. A person who applies for a company confirms that they are allowed to act for it.</p><p>Shoppers see the store name, the store location, the support email, where the store ships from, the processing time, and the return policy. For the store location, shoppers see only the country and the province, territory, or state; Panopie does not ask for a street address or a city in that field. For an individual seller, shoppers see only the country unless the store owner chooses to show the province, territory, or state as well. The store location is the merchant’s own statement, and Panopie does not verify it. A company’s registered name is also shown. The legal name of an individual or a sole proprietor is not shown on the store page; the store is shown as “Individual seller” or “Registered sole proprietor”. Panopie may give a merchant’s legal name and contact details to a buyer, a payment provider, a court, a regulator, or a tax authority when the law requires it, or when it is needed to deal with a legal claim about an order.</p><p>After an application is submitted, the merchant cannot change the seller type, legal name, or store location on its own. If any of them is wrong or changes later, for example because the merchant registers a business or moves, the merchant must tell Panopie through the merchant workspace. The owner of an individual seller’s store can change at any time whether the province, territory, or state is shown. Panopie may return the application so the merchant can correct it. When the store owner asks, Panopie may instead correct the store location for the merchant. The store then keeps its status, and its listings are not reviewed again. The corrected location is still the merchant’s own statement. If the new location is Quebec, the rule in section 1 applies, and Panopie may end the store under section 13.</p><p>Panopie does not collect identity documents, dates of birth, or personal tax numbers in this pilot. Before paid checkout opens for a store, the payment provider will check the merchant’s identity, bank account, and tax details under its own terms, and the merchant must complete those checks and keep the details current. Panopie may still ask for reasonable proof of product sourcing, the right to sell, business registration, or insurance. If a law requires Panopie itself to collect or report more information about sellers, Panopie will tell the merchant first and update these Terms.</p><p>A merchant that is registered for GST/HST in Canada may add its GST/HST number. This is optional. It is not shown to shoppers. Panopie staff who review applications can see it, and so can the people the merchant adds to its store team, who can also see the legal name. Panopie uses it only to know whether the merchant is registered for GST/HST, which can decide whether the merchant or the marketplace must collect that tax once paid checkout opens. Do not enter a Social Insurance Number. Panopie does not check the number with the tax authority, so the merchant is responsible for making sure it is correct.</p><p>The relationship is non-exclusive. The merchant keeps its own website, social channels, packaging, and customer-facing brand identity. The merchant is an independent seller, not an employee, agent, franchisee, or partner of Panopie. The merchant may not present itself as authorized by Panopie beyond an approved store profile.</p>`],
            ['listing-rights', '4. Listings, content, and authorization', `<p>The merchant is responsible for every title, image, video, description, price, size chart, SKU, brand name, trademark, claim, and product link it submits. The merchant confirms that it owns each product it lists or otherwise has the right to sell it, that each product is genuine, and that it owns or has permission to use the photos and text. Content must be accurate, current, and not misleading. A brand name may be used only to identify a genuine product of that brand. The merchant must not suggest that it is an authorized dealer of a brand unless that is true.</p><p>For a pre-owned piece, the photos must show the actual piece that is for sale, including any flaw described in the listing. For unworn vintage with more than one identical unit, the photos must show a piece from the same stock, and the listing must say so. For unworn vintage with only one unit, the photos must show that unit.</p><p>The merchant grants Panopie a non-exclusive, worldwide, royalty-free right during the listing term to host, reproduce, resize, translate, display, promote, and link that content only to operate and market the marketplace. After a listing ends, Panopie may keep a copy of the listing, its review history, and the details saved with each order as a record. Panopie may remove or pause listing content that is clearly inaccurate, unsafe, infringing, or incomplete, or return it to the merchant for changes, and will make reasonable efforts to tell the merchant why.</p>`],
            ['products-compliance', '5. Products, condition, safety, and legal compliance', `<p>The merchant may list only lawful, genuine, safe, and accurately described goods. Counterfeit, stolen, recalled, prohibited, or materially misrepresented goods are not allowed. This pilot is for adult clothing, footwear, bags, accessories, and jewelry; children’s products are not accepted. “Children’s products” means items designed or sold mainly for children aged 12 or under. An item that a product-safety law in a market the merchant serves treats as a children’s product, such as jewelry made to appeal mainly to children under 15 in Canada, is also not accepted. The merchant must keep records that reasonably support authenticity and product sourcing, and must promptly tell Panopie about a recall, safety issue, regulatory notice, or credible infringement claim.</p><p>Every listing must say whether the piece is new or pre-owned before it is sent for review. “New” means the piece has never been worn or used. For a new piece, the merchant may also say whether it comes with or without its original tags. This answer is optional, but if it is given it must be true: “New with tags” means the original maker’s or retailer’s tags are still attached. “Pre-owned” means the piece has been worn or owned before. For a pre-owned piece the merchant must choose a condition grade (Like new, Very good, Good, or Fair) and describe the wear, marks, repairs, alterations, and anything missing. If there are none, the merchant must say so.</p><p>A listing that uses the Vintage style, the style tag “archive” or “retro”, or any style tag that contains the word “vintage”, must choose one of three types. “New piece in a vintage style” is a newly made piece and must be listed as new. “Pre-owned vintage” is a second-hand piece that was made at least 20 years before it is listed, and must be listed as pre-owned with an era. “Unworn vintage (deadstock)” is old stock that was made at least 20 years before it is listed and has never been worn or used; it must be listed as new with an era, and the merchant must describe any storage marks, fading, or other signs of age it knows about. A second-hand piece that is less than 20 years old must be listed as pre-owned without a vintage type.</p><p>The merchant must have a reasonable basis for every statement about condition, age, era, and unworn status, such as labels, purchase records, or knowledge of the source, and must show it to Panopie on request. Words such as “vintage”, “deadstock”, “new old stock”, “archive”, “retro”, or “new with tags” in a title or description must agree with the answers chosen for the listing.</p><p>These answers are the merchant’s own statements. Panopie reviews a listing to see that it is complete and has no obvious problem. Panopie does not inspect, grade, date, or authenticate products, and its approval of a listing does not confirm that the listing is true. The merchant must not say or suggest that Panopie has verified, authenticated, or guaranteed a product.</p><p>Each order line keeps a copy of the condition, tags answer, condition notes, vintage type, and era shown on the listing when the order was placed. Later changes to the listing do not change that copy. The buyer, the merchant, and Panopie can use it if there is a dispute.</p><p>For apparel and textile goods, the merchant is responsible for the fiber-content, dealer-identity, care, origin, language, marketing, and consumer-product rules that apply in every market it chooses to serve, and must not remove a label that the law requires. For a pre-owned or vintage piece, the merchant should state fiber content, origin, or care only when it knows them from a label or another reliable source. If they are not known, the merchant must say so and must not guess. The merchant must not make unsupported sustainability, health, performance, availability, discount, or “limited” claims. Legal consumer rights always override a merchant policy where required.</p>`],
            ['stock-price-tax', '6. Inventory, price, tax, and availability', `<p>The merchant must keep stock, variants, prices, currency, tax treatment, processing times, and return terms current. A merchant must not accept an order it cannot reasonably fulfill. If an approved listing becomes unavailable or its information changes materially, the merchant must update it immediately or request it be paused. A one-of-a-kind piece that is sold anywhere else must be removed from Panopie at once.</p><p>Each store sets its prices in one currency, US dollars or Canadian dollars. It starts as Canadian dollars for a store based in Canada and US dollars for any other store. Only the store owner can change it, and only while the store has no listings, including drafts. On the site for the other country, shoppers may also see an estimate in their own currency. The estimate is not the price. The merchant chooses the countries it ships to, and an order to a country the store does not ship to is refused.</p><p>Before live checkout, Panopie will require a written rule for taxes, shipping charges, duties, discounts, price corrections, and out-of-stock cancellations. Every merchant, whether an individual, a sole proprietor, or a company, remains responsible for its own tax registrations, tax returns, payments to tax authorities, business records, and product-specific obligations unless the Payment Addendum says otherwise. Selling as an individual does not remove tax duties that the law places on the seller. Panopie does not give tax advice.</p><p>When the merchant ships an order from one country to a buyer in another, the buyer may have to pay import duties, taxes, customs fees, or carrier brokerage fees when it arrives. If the buyer has to pay any of these charges, and checkout did not show the buyer the amount or an estimate of it before payment, the merchant must refund those charges once the buyer shows a receipt or another record of the payment. A general note that such charges “may apply” does not count as showing them. If checkout showed an estimate and the buyer had to pay more, the merchant must refund the difference. The merchant can avoid these refunds by shipping with the charges prepaid. The merchant must declare the true contents and value of every shipment on customs forms. This applies only to paid orders.</p><p>In some places the law may require Panopie or its payment provider to collect tax on the merchant’s sales, or to report the merchant’s sales and seller details to a tax authority. Where it does, Panopie or the provider will follow the law, and the merchant must give the information that is needed. The details will be set out in the Payment Addendum before paid checkout opens.</p>`],
            ['fulfilment-returns', '7. Fulfillment, buyer support, returns, and disputes', `<p>The merchant fulfills its own orders unless a future written fulfillment service says otherwise. It must dispatch within the promise shown at checkout, provide valid carrier and tracking information when available, package products safely, and communicate quickly about delay, loss, cancellation, or address issues. A pre-owned piece must be free of dirt and strong odors when it is shipped. If the merchant has not washed or cleaned it, the listing must say so in its condition notes.</p><p>The merchant must publish a return policy that states the return window, the condition an item must be in, and who pays for return shipping. Each listing must follow that policy and the consumer law that applies. The merchant is responsible for return instructions, inspection, replacement, refund, and reasonable support for the buyers of its goods.</p><p>If a piece is materially different from the listing as it was when the order was placed, including the condition, vintage type, and era saved with the order and the size ordered, the merchant must accept its return, refund the price and the original shipping charge, and pay for the return shipping. The buyer must report the problem within 14 days of delivery and show it with photos. This is a minimum. It does not limit any longer period or stronger right that the law gives the buyer. It applies even when the merchant’s policy says “final sale”. A merchant may sell a pre-owned or vintage piece as final sale only if its policy says so clearly, and never in a way that removes a right the law gives the buyer.</p><p>If the merchant ships an order from one country to a buyer in another, and the buyer returns a piece under the merchant’s return policy, this section, or the law, the merchant must give the buyer one of these: a return address in the buyer’s country, a prepaid return label, or a full refund without the piece being sent back. The merchant chooses which one, and its return policy must say which it offers to buyers in another country. The buyer must not have to pay import duties, taxes, or customs fees to send the piece back. For a piece that is materially different from the listing, the merchant pays for the return in every case. For any other return, if the merchant’s return policy says the buyer pays for return shipping, the merchant may take the cost of the prepaid label from the refund, but only if it tells the buyer the cost before the buyer uses the label.</p><p>If the merchant cannot dispatch an order within the promised time, it must tell the buyer and offer a cancellation with a full refund. The merchant must answer a return request, or a buyer’s message about a delivery problem such as a late, lost, damaged, or wrong item, within 2 business days (Monday to Friday). An answer accepts the request, refuses it with a reason, or asks the buyer for what the merchant needs in order to decide. If the merchant does not answer in time, the buyer may ask Panopie support to step in. Panopie will then contact the merchant, may ask for the order, shipping, and message records, and will tell the buyer what happens next. Panopie does not pay refunds itself, and stepping in does not make it the seller. Failing to answer buyers more than once can count as repeated fulfillment failure under section 10. Accepting a return in the merchant workspace is not a refund. A refund is made only through the payment service once one is connected.</p><p>Panopie may pause a listing or order flow while a serious buyer, quality, authenticity, safety, delivery, or chargeback dispute is reviewed. If a buyer and a merchant cannot settle a problem, Panopie may look at it, and the merchant must cooperate and share the records it has. What Panopie decides about a listing or a store on the platform does not decide either side’s legal rights.</p>`],
            ['payment-payout', '8. Checkout, payment processing, and settlement', `<p><strong>Current pilot status:</strong> Panopie does not yet collect buyers’ money, store bank details, or make payouts. No “instant payout,” buyer-confirmed payout, or other payout timing is promised in this build. A merchant cannot treat a saved order request as paid or ship an item because of it.</p><p>Before live checkout, the merchant must complete the payment provider’s onboarding and accept the Payment Addendum. The payment provider, not Panopie, checks the merchant’s identity and bank details, and may share the result of those checks and the status of the payout account with Panopie. The Payment Addendum will state the processor, settlement schedule, reserves, refunds, chargebacks, taxes, negative balances, verification, and what happens if a payout account is restricted. Until it is accepted and the account is connected, no money-moving service exists.</p>`],
            ['privacy-data', '9. Buyer data and privacy', `<p>The merchant may use buyer data received through Panopie only to fulfill an order, give the support it must give, prevent fraud, meet legal duties, or obtain a separate lawful consent. It may not sell, rent, scrape, retain unnecessarily, or use buyer data for unrelated marketing. The merchant must keep the data secure and limit access to people who need it.</p><p>The merchant must notify Panopie without undue delay of a suspected data breach, unauthorized access, or incorrect disclosure involving the information of buyers on Panopie, and cooperate with reasonable investigation and notices. Panopie will separately maintain its own privacy notice before public launch.</p><p>Panopie keeps the merchant’s own information: account email, store details, store location, seller type, legal name, the optional GST/HST number, listings, messages, review notes, and the record of accepting these Terms. For an individual or a sole proprietor this is personal information. Panopie uses it to review the application, run the store, deal with orders and disputes, keep the marketplace safe, and meet legal duties.</p><p>Panopie keeps records of applications, review decisions, and staff actions. A record of a review decision can include the legal name on the application at that time, and a record of a location change can include the old and the new store location. Panopie may keep these records after a store closes, for as long as it needs them for legal, tax, dispute, or safety reasons. A merchant can ask Panopie for a copy of the information it holds about the merchant, or ask Panopie to correct or delete it, by sending Panopie a support message from the Messages page. The person who holds the account can also ask for a copy of their account data, or for a review of account deletion, on the Security &amp; privacy page. Panopie will answer within 30 days after it receives the request. If the law allows more time, Panopie will say why and give the new date. Panopie will explain if it must keep some records. Panopie uses service providers to host the site and to store marketplace data. At least one of them is based outside Canada, so some information may be processed or stored outside Canada. While information is outside Canada, it is subject to the laws of that country, and its courts, law enforcement, and national security authorities may be able to access it. Before public launch, the privacy notice will name a privacy contact and say how long each kind of record is kept.</p>`],
            ['review-enforcement', '10. Review, suspension, and enforcement', `<p>Panopie may review a store, listing, product image, policy, or buyer complaint before or after approval. It may request changes, reject a listing, remove content, pause sales, hold a review, or suspend a store where it reasonably believes there is fraud, infringement, safety risk, repeated fulfillment failure, misleading information, harm to buyers, or a breach of these Terms.</p><p>A store review has three possible results. Panopie can approve the store. It can return the application for changes: the store goes back to draft with a note, and any listings that were live or waiting for review also go back to draft. After the store is approved again, each of those listings must be sent for review again. Or it can suspend the store: the store and its listings are no longer shown to shoppers, and the merchant must not send listings for review until the suspension ends, as section 14 describes.</p><p>A listing can go live only while its store is approved. Each listing is reviewed on its own, and approval of one store or product does not approve later products automatically. If the merchant changes the content of a live listing, the listing goes back to draft and must be sent for review again. Stock and price updates do not need a new review.</p><p>A Panopie staff account cannot review a store that it owns or belongs to, or a listing from that store.</p><p>Where practical, Panopie will give the merchant a reason and an opportunity to respond. A return or a suspension comes with a note that the merchant can read in the merchant workspace, and the merchant can reply by messaging Panopie support. Immediate action may be taken where delay could cause harm, legal risk, or material loss to buyers. Returning or suspending a store does not cancel orders that were already placed; the merchant must still fulfill or refund them.</p><p>If someone tells Panopie that a listing infringes their trademark, copyright, or other rights, or is counterfeit, Panopie may remove the listing while it looks into it and will tell the merchant. The merchant may answer with evidence. Panopie may suspend or close the store of a merchant that infringes more than once. Before public launch, Panopie will publish a contact for these reports.</p>`],
            ['brand-integrity', '11. Marks, reputation, and marketplace integrity', `<p>Each party keeps ownership of its own name, logo, content, and intellectual property. The merchant may describe itself as an approved Panopie store only while approved, and may not say or suggest that Panopie has inspected, authenticated, or guaranteed its products. The merchant may not register confusing names, imitate the marketplace, manipulate reviews, create fake orders, move an order placed through Panopie off the platform, or contact buyers outside the order relationship without their consent.</p><p>Panopie may use truthful public store and listing information to present the marketplace. It will not claim ownership of the merchant’s products or brand merely because they appear on Panopie.</p>`],
            ['risk-liability', '12. Responsibility and indemnity', `<p>The sale of a product is a contract between the merchant and the buyer. Panopie provides the marketplace and is not the seller, unless the law treats it as one for a specific purpose such as collecting tax. The merchant is responsible for its products, listings, people, inventory, taxes, shipping, returns, and legal compliance. An individual or a sole proprietor is personally responsible for these duties.</p><p>To the extent permitted by law, the merchant will defend and reimburse Panopie for third-party claims, losses, penalties, or reasonable costs caused by the merchant’s products, content, breach, negligence, fraud, or legal non-compliance.</p><p>Panopie provides the pilot “as is” and does not guarantee uninterrupted availability, buyer demand, search placement, or error-free operation. Neither party excludes liability that cannot lawfully be excluded. Any broader allocation of risk, insurance requirement, or financial cap must be set out in the Payment Addendum or in a later version of these Terms that the merchant accepts before live commerce begins.</p>`],
            ['term-ending', '13. Term, termination, and exit', `<p>The merchant accepts these Terms when it submits its application, and they apply as described in section 1. The merchant may withdraw an application, and either party may end a store, with written notice, subject to completing its open obligations to buyers and to the Payment Addendum once there is one. A message through the merchant workspace counts as written notice. Panopie may suspend or end the relationship immediately for the reasons in section 10.</p><p>On exit, the merchant must stop using Panopie marks, remove or update marketplace links as requested, fulfill or refund active orders as applicable, and return or securely delete buyer data when no longer needed. Panopie will take the store and its listings off the marketplace and will keep records as described in section 9. Sections 4 (records kept after a listing ends), 6 and 7 (orders already placed), 9, 11, 12, and 14 continue to apply after the store ends.</p>`],
            ['legal-contact', '14. Changes, governing law, notices, and acceptance', `<p>Panopie may update these Terms by posting a new version with a new version number and date. For a merchant whose application has been submitted or approved, Panopie will post a notice in the merchant workspace when it publishes a version with a material change. The notice gives the last day to accept, which is at least 30 days after the notice is posted. The owner or an administrator of the store accepts the new version in the merchant workspace, and Panopie keeps a record of each version accepted, with the date, the time, and the account. The earlier version keeps applying until the merchant accepts the new one. If the merchant has not accepted by the last day, Panopie may suspend the store, or the merchant may end the store under section 13. For a change that the law requires, or that is needed to stop fraud or a safety risk, the time to accept may be shorter, and Panopie will explain why. A suspension ends when Panopie restores the store or returns it for changes. The owner or an administrator of a suspended store can still accept the current version in the merchant workspace, but accepting does not end the suspension by itself. If not accepting was the only reason for the suspension, Panopie will restore the store after the store accepts. The store and the listings that were live before the suspension are then shown to shoppers again without a new review. A listing that the merchant changed during the suspension goes back to draft and must be sent for review again. If the store was suspended for another reason, Panopie may return it for changes. The store then goes back to draft, the merchant accepts the current version when it submits the store again, and listings that were live or waiting for review go back to draft and must be sent for review again after the store is approved. A change will not retroactively alter a completed order or accepted payout arrangement without a lawful basis and notice.</p><p>For this Toronto pilot, these Terms are governed by the laws of Ontario and applicable federal Canadian law, without limiting mandatory protections under the law of the place where the merchant or the buyer lives. Before public launch, Panopie must add its legal entity name, business address, consumer-support contact, privacy notice, the Payment Addendum, and a dispute process after legal review.</p><p>Panopie sends notices to the merchant through the merchant workspace and may also use the account email. The merchant sends notices to Panopie through the merchant workspace until Panopie publishes a support contact. These Terms and the record of acceptance are electronic, and the merchant agrees to that. The merchant can print or save this page at any time. Panopie will send the merchant a copy of any earlier version it accepted if the merchant asks.</p><p>By checking the two boxes in the merchant application and submitting it, the person submitting confirms that they are the merchant or are allowed to act for it, that they have read this version, that the information in the application is true, that they have the right to list and sell the products they submit, and that they understand no live payment or payout service is activated by that submission. A person who accepts a later version in the merchant workspace confirms the same things for that version.</p>`]
          ];
          return `<section class="terms-page"><header class="terms-header"><div><h1>Founding Store Pilot Terms.</h1><p>Everything an individual seller, small retailer, vintage store, or emerging brand should know before applying: the 90-day offer, what Panopie handles, what the merchant still controls, the rules for pre-owned and vintage pieces, and what is not live yet.</p></div><div class="terms-meta"><strong>Version ${esc(termsNumber(FOUNDING_TERMS_VERSION))}</strong><span>Private pilot · Updated ${esc(longDate(termsStamp(FOUNDING_TERMS_VERSION)))}</span><span>Only the name changed, from THREADLINE to Panopie.</span></div></header><section class="terms-offer" aria-label="Founding store offer"><div><strong>0 platform commission</strong><span>for the first 90 days after paid checkout opens for your store</span></div><div><strong>0 deposit · 0 annual fee</strong><span>processor, shipping, tax, refund, and chargeback costs are separate</span></div><div><strong>Non-exclusive</strong><span>keep your own store, brand, packaging, and fulfillment</span></div></section><section class="terms-notice"><strong>Important:</strong> these are the working terms for the private pilot. They have not been reviewed by a lawyer and will change before paid checkout opens. Submitting an application records your acceptance of this version. It does not activate sales, payment processing, or payouts. Those start only after Panopie approves the store and names its legal operator, and the merchant completes the payment provider’s checks and accepts the Payment Addendum.</section><div class="terms-actions">${termsUpdateDue() && termsCanAccept() ? `<a class="platform-button" href="${path('seller')}" data-route="seller">Back to your store to accept version ${esc(termsNumber(FOUNDING_TERMS_VERSION))}</a>` : termsUpdateDue() ? `<a class="platform-button" href="${path('seller')}" data-route="seller">Back to your store</a>` : state.merchant.submitted ? `<a class="platform-button" href="${path('seller')}" data-route="seller">Back to your store</a>` : `<a class="platform-button" href="${path('seller-start')}" data-route="seller-start">Start your application</a>`}<button class="platform-button is-secondary" type="button" data-print-terms>Print or save PDF</button></div><div class="terms-layout"><aside class="terms-toc" aria-label="Pilot terms sections"><strong>On this page</strong><nav>${sections.map(([id, title]) => `<a href="#${id}">${esc(title.replace(/^\d+\. /, ''))}</a>`).join('')}</nav></aside><article class="terms-content"><section class="terms-checklist"><h2>Before you submit</h2><ul><li>Choose the seller type that is true for you: individual, registered sole proprietor, or company. Use your own full legal name, or the registered company name.</li><li>Know your store location: the country and, for Canada or the United States, the province, territory, or state where the store is based. Shoppers see it on your store page; for an individual seller they see only the country unless you choose to show more.</li><li>Use a customer contact email that you are happy to show to shoppers.</li><li>Prepare a clear return policy, processing time, real stock, and real product information. If you ship to another country, your return policy must say how buyers there can return a piece.</li><li>For every piece, be ready to say whether it is new or pre-owned. For a pre-owned piece, describe the wear. For a vintage piece, know the era.</li><li>Only upload products, photos, brand names, and claims you have the right to use.</li><li>Know that payments and payouts are not connected in this pilot yet.</li><li>The pilot is not open to stores that are based in Quebec or ship from Quebec, and orders must not be shipped to Quebec during the pilot.</li></ul></section>${sections.map(([id, title, copy]) => `<section class="terms-section" id="${id}"><h2>${esc(title)}</h2>${copy}</section>`).join('')}${termsUpdateDue() && termsCanAccept() ? `<section class="terms-final"><h2>Ready to accept?</h2><p>The form to accept version ${esc(termsNumber(FOUNDING_TERMS_VERSION))} is at the top of your store overview. Do not accept if a term is unclear; <a href="${path('messages')}" data-route="messages">message Panopie</a> first.</p><a class="platform-button" href="${path('seller')}" data-route="seller">Back to your store to accept version ${esc(termsNumber(FOUNDING_TERMS_VERSION))}</a></section>` : termsUpdateDue() ? `<section class="terms-final"><h2>Finished reading?</h2><p>The store owner or a store administrator accepts version ${esc(termsNumber(FOUNDING_TERMS_VERSION))} from the store overview. Your account can’t accept for the store.</p><a class="platform-button" href="${path('seller')}" data-route="seller">Back to your store</a></section>` : `<section class="terms-final"><h2>Need to review a point?</h2><p>Do not submit a store if a term is unclear. Your application stays in draft until you are ready to apply.</p><a class="platform-button" href="${path('seller-start')}" data-route="seller-start">Go to merchant application</a></section>`}</article></div></section>`;
        };
        const sellerStart = () => {
          if (backendConfigured() && !useBackend()) return `<section class="platform-intro"><div><h1>Store services are unavailable.</h1><p>Reconnect before applying. No browser-only store will be created.</p><button class="platform-button is-secondary" type="button" data-commerce-retry>Retry connection</button></div></section>`;
          if (useBackend() && !currentUserId) return `<section class="merchant-preflight"><div class="merchant-preflight-main"><h1>Sell on Panopie. Keep your name.</h1><p>Panopie is a new marketplace. Reviewed stores will sell clothing here, and shoppers will check out from one bag. Your store keeps its own name, prices, shipping, and return policy.</p><div class="merchant-preflight-actions"><a class="platform-button" href="${path('register', { mode: 'signup', next: 'seller-start' })}" data-route="register" data-mode="signup" data-next="seller-start">Create an account to apply</a><a class="platform-button is-secondary" href="${path('register', { next: 'seller-start' })}" data-route="register" data-next="seller-start">Sign in</a><a class="platform-button is-secondary" href="${path('merchant-terms')}" data-route="merchant-terms">Read pilot terms</a></div><p>Panopie is in a private pilot. Shoppers can’t pay yet, and no store is selling yet, so you would be one of the first. We can’t promise traffic or sales. We aren’t reviewing new store applications yet. If you apply now, we’ll return your application and tell you why.</p><section class="merchant-preflight-steps-block" aria-labelledby="joining-title"><h2 id="joining-title">How joining works</h2><ol class="merchant-preflight-steps"><li><strong>Apply.</strong> Create an account and fill in the three-step application: store details; delivery and returns; and store type, audience, and terms. Submitting the application is how you accept the pilot terms.</li><li><strong>We review your store.</strong> We aim to reply within 5 business days (Monday to Friday, Toronto time, not counting Ontario public holidays). This is a target, not a guarantee. If we can’t approve your store, we return the application with a note that says why.</li><li><strong>Add your pieces.</strong> Add them one at a time, or import a product file from Shopify, WooCommerce, or our template. Importing is a one-time copy: stock doesn’t sync with your shop, so update it here or use Sold elsewhere. You still add the photos and write the condition, materials, fit, and care details yourself. You can save drafts before your store is approved and add photos once you have submitted your application. You can send pieces for review once your store is approved.</li><li><strong>We review each listing.</strong> We aim to reply within 2 business days. A listing goes live only after it is approved. Price and stock changes don’t need a new review. If you change the details or photos of a live listing, it comes down until we review it again.</li></ol></section></div><dl class="merchant-preflight-list"><div><dt>Who can apply</dt><dd>Individuals, registered sole proprietors, and companies that run an independent label, a boutique, or a vintage or second-hand store. The pilot is not open to stores that are based in Quebec or ship from Quebec.</dd></div><div><dt>What we look for</dt><dd><p>Every store and listing is reviewed. We look at your pieces, photos, and listings, your store’s public pages and audience, and the figures you give us in your application. Not every store that applies will be accepted.</p><ul class="merchant-preflight-points"><li>Pieces you have the right to sell, shown in clear photos that you took or have the right to use. A pre-owned piece needs photos of the actual piece.</li><li>Complete, accurate listing facts, including condition for pre-owned pieces and era for vintage pieces that are 20 or more years old.</li><li>A return policy and shipping rates that shoppers can understand before they buy.</li><li>A store that can answer return requests and delivery questions within 2 business days (Monday to Friday, not counting Ontario public holidays).</li></ul><p>We don’t inspect, grade, date, or authenticate pieces.</p><p class="merchant-preflight-links"><a href="${path('listing-standard')}" data-route="listing-standard">Read the listing standard</a><a href="${path('how-we-review')}" data-route="how-we-review">Read how we review stores and listings</a></p></dd></div><div><dt>What stays yours</dt><dd>Your store has its own page with your store name and your story, and every piece you list on Panopie shows your store name. You set your own prices, shipping rates, and return policy, within the minimum rules in the pilot terms. You keep your own stock and send your own orders, yourself or through a shipping service you choose. Selling on Panopie is non-exclusive, so you can keep selling in your own shop and anywhere else.</dd></div>${legalProfile.terms24Published ? `<div><dt>Fees</dt><dd><p>Panopie’s selling fee is a percentage of the price of the items in each paid order. It isn’t charged on shipping, taxes, or import duties and fees. Under these terms, there is no deposit, setup fee, listing fee, monthly fee, or annual fee.</p><ul class="merchant-preflight-points"><li><strong>Founding stores</strong> (stores we first approve before we open to shoppers): 0% for the first 90 days. Day 1 is the later of the day paid checkout is turned on for your store and the day we open to shoppers. Then 6% until 12 months after day 1, and 9% until 24 months. We won’t raise these rates during those 24 months. After that, the standard fee.</li><li><strong>Stores we first approve in the first year after we open to shoppers:</strong> 0% for the first 90 days, then the standard fee. The terms say when day 1 is.</li><li><strong>Standard fee:</strong> 11% of the price of the items. Under these terms, no store pays more than 16%.</li><li><strong>Stores that list in a currency other than Canadian dollars</strong> also pay a conversion charge on the selling fee. It passes on our payment provider’s cost of converting our fee, with no profit added, and is about 2% of the selling fee (for example, about US$0.22 on US$100 of items at 11%). There is none while your fee is 0%. The 16% limit includes it. It is not given back on refunds. It can change when our payment provider changes its rate, including during a founding store’s 24 months. We show the current rate in your workspace.</li></ul><p>Your store pays the payment provider’s own fees, such as the card processing fee, directly to the provider, at the provider’s prices. Panopie doesn’t receive any part of them. Shipping, taxes, refunds, chargebacks, and dispute fees are separate. We give at least 60 days’ notice before we raise a fee, add a new fee, or change how a fee is calculated in a way that costs you more. The terms set out every fee schedule and who starts on which one. If this summary and the terms differ, the terms apply.</p></dd></div>` : `<div><dt>Fees</dt><dd>No platform commission for the first 90 days after paid checkout opens for your store. No deposit, setup fee, or annual fee. Payment processing, shipping, tax, refund, and chargeback costs are separate. Any fee after the 90 days will be set out in a new version of the terms, and it applies only after you accept it. If you don’t accept it by the date in the notice, the store may be suspended, and you can close your store at any time.</dd></div>`}<div><dt>Listings</dt><dd>Your store’s currency is set by where it’s based: Canadian dollars for a store in Canada, and US dollars for a store anywhere else. You enter all prices and shipping rates in it. Shoppers who browse in the other currency also see an approximate amount, marked as an estimate. Your price stays the price. You can add pieces one at a time or import them from a Shopify, WooCommerce, or template file.</dd></div><div><dt>Prepare to apply</dt><dd>Your legal name (your own full name if you sell as an individual or a registered sole proprietor, or your company’s registered name), contact details, a store link if you have one, your store location (the country, and for Canada or the United States the province, territory, or state), where you ship from, and a clear return policy. If you ship to another country, it must say how buyers there can return a piece: a return address in their country, a prepaid return label, or a refund without a return. Also have ready the kind of store you run (your own label, a boutique, or a vintage or second-hand store), your store’s social accounts and their total followers, and, if you sell online, your online store address and about how many pieces you sell in an average month.</dd></div><div><dt>Buyer support</dt><dd>You answer return requests and messages about delivery problems within 2 business days (Monday to Friday, not counting Ontario public holidays). If you ship to another country, you refund any import charges that checkout did not show before payment.</dd></div><div><dt>What is not active</dt><dd>Approval does not turn on paid checkout, customer charges, payouts, or settlement onboarding.</dd></div></dl><section class="merchant-preflight-more" aria-labelledby="questions-title"><h2 id="questions-title">Questions stores ask</h2><h3>Do I need a Shopify store?</h3><p>No. A product file from Shopify or WooCommerce saves typing, and other stores can use our template. You can also add every piece by hand.</p><h3>Can I keep selling elsewhere?</h3><p>Yes. Selling on Panopie is non-exclusive. If a one-of-a-kind piece sells somewhere else, you must take it off Panopie at once: mark it “Sold elsewhere” in your workspace and it comes off Panopie right away. If someone has already ordered it on Panopie, you still need to tell the buyer and cancel that order.</p><h3>Where can I ship to?</h3><p>You choose. Stores can ship to the United States, Canada (except Quebec), the United Kingdom (except Northern Ireland), Australia, and New Zealand. Stores based in Quebec or shipping from Quebec can’t join during the pilot.</p><h3>Can I close my store?</h3><p>Yes. You can close your store at any time by sending us a message in your workspace, as the pilot terms explain. You still need to send or refund any open orders.</p><h3>Can I sell vintage and pre-owned pieces?</h3><p>Yes. Each pre-owned piece needs a condition grade and condition notes           if (state.merchant.submitted) return seller();
